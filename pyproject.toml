[project]
name = "tardis-reader"
version = "0.1.0"
description = "Fetches historical market data from Tardis.dev"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
tardis-fetch = "tardis_reader.cli:main"
tardis-inspect = "tardis_reader.inspect_cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
